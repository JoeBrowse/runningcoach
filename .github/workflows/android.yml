# Builds the Skid Marks Android app (APK).
#
# Every push builds a debug APK (and the Wear OS watch APK) and keeps them
# as workflow artifacts.
# A push to main also publishes the APK on a GitHub Release, so the
# latest build is always at:
#   https://github.com/JoeBrowse/skidmarks/releases/latest/download/skid-marks.apk
#
# The APK is signed with the fixed test key in signing/ (see its README).
# It is a test build: Android asks the user to allow apps from unknown sources.
# Builds with the same key install over each other.
name: Android APK

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build the web app
        run: npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          node scripts/android-permissions.mjs
          node scripts/android-signing.mjs

      - name: Make the app icons and splash screens
        run: npx @capacitor/assets generate --android || echo "Icon generation failed. The build uses the default icon."

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Set the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Use the fixed test signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk skid-marks.apk

      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: skid-marks-apk
          path: skid-marks.apk

      # The Wear OS watch app (wear/). It uses the same fixed key as the
      # phone app, so the two apps can send data to each other.
      - name: Build and test the watch app
        working-directory: wear
        env:
          WEAR_VERSION_CODE: ${{ github.run_number }}
          WEAR_VERSION_NAME: ${{ env.VERSION }}
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Rename the watch APK
        run: cp wear/app/build/outputs/apk/debug/app-debug.apk skid-marks-wear.apk

      - name: Keep the watch APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: skid-marks-wear-apk
          path: skid-marks-wear.apk

      - name: Publish the APK on a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Skid Marks ${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            Test build of Skid Marks, made from commit ${{ github.sha }}.
            Download skid-marks.apk and open it on an Android phone.
            Android asks you to allow apps from unknown sources. This is a test build signed with a debug key.
            skid-marks-wear.apk is the Wear OS watch app. To install it, see docs/wear-os.md.
          files: |
            skid-marks.apk
            skid-marks-wear.apk
          make_latest: true
